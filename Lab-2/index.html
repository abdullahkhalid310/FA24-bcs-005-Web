
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymshark - Lab 2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-md bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">GYMSHARK</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarLinks"
                    aria-controls="navbarLinks"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarLinks">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Men</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">New Arrivals</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Accessories</a>
                    </li>
                </ul>

                <a class="nav-link" href="#">🛒 Cart</a>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <h1 class="text-center mb-4">Featured Products</h1>

        <div class="product-grid">
            <div class="product-card">
                <div class="product-image"><img src="images/c2product6.webp" alt="t shirt"></div>
                <h3>Training T-Shirt</h3>
                <p>$30</p>
            </div>

            <div class="product-card">
                <div class="product-image"><img src="images/product2.webp" alt="shorts"></div>
                <h3>Gym Shorts</h3>
                <p>$35</p>
            </div>

            <div class="product-card">
                <div class="product-image"><img src="images/product6.webp" alt="hoodie"></div>
                <h3>Training Hoodie</h3>
                <p>$50</p>
            </div>

            <div class="product-card">
                <div class="product-image"><img src="images/product7.webp" alt="joggers"></div>
                <h3>Training Joggers</h3>
                <p>$40</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
